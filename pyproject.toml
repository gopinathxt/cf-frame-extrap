[project]
name = "cf-frame-extrap"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Prevent setuptools from treating data/artifact folders as packages.
packages = ["cf_frame_extrap"]

[tool.ruff]
line-length = 110

